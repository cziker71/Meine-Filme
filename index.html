<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTracker - Meine Film-Sammlung</title>
  <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Search Container */
    .search-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .search-card h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-wrapper input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 12px 12px 40px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
    }

    .search-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Search Results Grid */
    .search-results {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .result-item img {
      width: 45px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--border);
    }

    .result-info { flex: 1; }
    .result-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .result-meta { font-size: 12px; color: var(--text-muted); }

    .result-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    /* Controls (In Liste suchen / Filter) */
    .list-controls {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-controls select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    /* Movie Cards */
    .movie-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .movie-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
    }

    .movie-poster {
      width: 55px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--border);
    }

    .movie-details { flex: 1; }
    .movie-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .movie-meta { font-size: 12px; color: var(--text-muted); }

    .action-check {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: transparent;
    }

    .action-check.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      font-size: 14px;
    }

    .btn-delete:hover { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-film"></i></div>
      <div>
        <div class="brand-title">CineTracker</div>
        <div class="brand-subtitle">Meine Film-Sammlung</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="exportData()" title="Exportieren"><i class="fa-solid fa-download"></i></button>
      <button class="btn-icon" onclick="importData()" title="Importieren"><i class="fa-solid fa-upload"></i></button>
    </div>
  </header>

  <div class="search-card">
    <h2>Neuen Film suchen & hinzufügen</h2>
    <div class="input-wrapper">
      <i class="fa-solid fa-film"></i>
      <input type="text" id="searchInput" placeholder="Filmtitel oder Serie eingeben..." oninput="debounceSearch()">
    </div>
    <div class="search-hint">Tippe den Namen ein, um Filmplakate, Genre & Jahr automatisch zu laden.</div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabWant" onclick="switchTab('want')">
      <i class="fa-solid fa-bookmark"></i> Möchte ich sehen <span class="badge" id="countWant">0</span>
    </button>
    <button class="tab-btn" id="tabSeen" onclick="switchTab('seen')">
      <i class="fa-solid fa-circle-check"></i> Bereits gesehen <span class="badge" id="countSeen">0</span>
    </button>
  </div>

  <div class="list-controls">
    <div class="input-wrapper" style="margin: 0;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="filterInput" placeholder="In dieser Liste suchen..." oninput="renderList()">
    </div>
  </div>

  <div id="movieList" class="movie-list"></div>

  <script>
    const API_KEY = 'ea010c0eb57a6714faf34f54b6007efc';
    let currentTab = 'want';
    let movies = JSON.parse(localStorage.getItem('cineTracker_movies') || '[]');
    let searchTimeout = null;

    function saveMovies() {
      localStorage.setItem('cineTracker_movies', JSON.stringify(movies));
      renderList();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabWant').classList.toggle('active', tab === 'want');
      document.getElementById('tabSeen').classList.toggle('active', tab === 'seen');
      renderList();
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchTMDB, 400);
    }

    async function searchTMDB() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsDiv = document.getElementById('searchResults');
      
      if (!query) {
        resultsDiv.innerHTML = '';
        return;
      }

      const url = `[https://api.themoviedb.org/3/search/multi?api_key=$](https://api.themoviedb.org/3/search/multi?api_key=$){API_KEY}&language=de-DE&query=${encodeURIComponent(query)}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        resultsDiv.innerHTML = '';

        if (!data.results || data.results.length === 0) return;

        data.results.slice(0, 4).forEach(item => {
          if (item.media_type !== 'movie' && item.media_type !== 'tv') return;

          const title = item.title || item.name;
          const year = (item.release_date || item.first_air_date || '').substring(0, 4);
          const poster = item.poster_path 
            ? `[https://image.tmdb.org/t/p/w92$](https://image.tmdb.org/t/p/w92$){item.poster_path}`
            : '[https://via.placeholder.com/92x138?text=Kein+Bild](https://via.placeholder.com/92x138?text=Kein+Bild)';

          const el = document.createElement('div');
          el.className = 'result-item';
          el.innerHTML = `
            <img src="${poster}">
            <div class="result-info">
              <div class="result-title">${title}</div>
              <div class="result-meta">${year} • ${item.media_type === 'tv' ? 'Serie' : 'Film'}</div>
            </div>
            <button class="result-btn" onclick='addMovie(${JSON.stringify(item).replace(/'/g, "&apos;")})'>+ Liste</button>
          `;
          resultsDiv.appendChild(el);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function addMovie(item) {
      const title = item.title || item.name;
      const year = (item.release_date || item.first_air_date || '').substring(0, 4);
      const poster = item.poster_path ? `[https://image.tmdb.org/t/p/w185$](https://image.tmdb.org/t/p/w185$){item.poster_path}` : '';

      if (!movies.some(m => m.id === item.id)) {
        movies.push({
          id: item.id,
          title: title,
          year: year,
          type: item.media_type === 'tv' ? 'Serie' : 'Film',
          poster: poster,
          seen: false
        });
        saveMovies();
      }
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }

    function toggleSeen(id) {
      const movie = movies.find(m => m.id === id);
      if (movie) {
        movie.seen = !movie.seen;
        saveMovies();
      }
    }

    function deleteMovie(id) {
      movies = movies.filter(m => m.id !== id);
      saveMovies();
    }

    function renderList() {
      const listDiv = document.getElementById('movieList');
      const filterText = document.getElementById('filterInput').value.toLowerCase();

      const wantList = movies.filter(m => !m.seen);
      const seenList = movies.filter(m => m.seen);

      document.getElementById('countWant').innerText = wantList.length;
      document.getElementById('countSeen').innerText = seenList.length;

      const activeList = currentTab === 'want' ? wantList : seenList;
      const filtered = activeList.filter(m => m.title.toLowerCase().includes(filterText));

      listDiv.innerHTML = '';

      if (filtered.length === 0) {
        listDiv.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Keine Einträge gefunden.</div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="action-check ${m.seen ? 'checked' : ''}" onclick="toggleSeen(${m.id})">
            <i class="fa-solid fa-check"></i>
          </div>
          <img class="movie-poster" src="${m.poster || '[https://via.placeholder.com/92x138?text=Bild](https://via.placeholder.com/92x138?text=Bild)'}" alt="">
          <div class="movie-details">
            <div class="movie-title">${m.title}</div>
            <div class="movie-meta">${m.year || ''} ${m.type ? '• ' + m.type : ''}</div>
          </div>
          <button class="btn-delete" onclick="deleteMovie(${m.id})"><i class="fa-solid fa-trash"></i></button>
        `;
        listDiv.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(movies));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "cinetracker_backup.json";
      a.click();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          movies = JSON.parse(event.target.result);
          saveMovies();
        };
        reader.readAsText(file);
      };
      input.click();
    }

    renderList();
  </script>
</body>
</html>
