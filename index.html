<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTracker - Meine Filme & Serien</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #e50914;
      --text-muted: #aaaaaa;
      --success-color: #2e7d32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .results-grid, .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background-color: #222;
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
    }

    .card-type {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-actions button {
      padding: 6px;
      font-size: 12px;
      width: 100%;
    }

    .btn-seen {
      background-color: var(--success-color);
    }

    .btn-remove {
      background-color: #444;
    }

    .section-title {
      margin-top: 30px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <h1>CineTracker</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Film, Serie oder Tatort suchen...">
    <button onclick="searchMedia()">Suchen</button>
  </div>

  <div class="results-grid" id="searchResults"></div>

  <h2 class="section-title">🎬 Möchte ich sehen</h2>
  <div class="watchlist-grid" id="wantToWatchList"></div>

  <h2 class="section-title">✅ Bereits gesehen</h2>
  <div class="watchlist-grid" id="alreadySeenList"></div>

  <script>
    const API_KEY = 'ea010c0eb57a6714faf34f54b6007efc';
    
    let wantToWatch = JSON.parse(localStorage.getItem('myWantToWatch') || '[]');
    let alreadySeen = JSON.parse(localStorage.getItem('myAlreadySeen') || '[]');

    function saveAndRender() {
      localStorage.setItem('myWantToWatch', JSON.stringify(wantToWatch));
      localStorage.setItem('myAlreadySeen', JSON.stringify(alreadySeen));
      renderLists();
    }

    function createCardHTML(item, listType, index) {
      const poster = item.poster_path 
        ? `https://image.tmdb.org/t/p/w300${item.poster_path}`
        : 'https://via.placeholder.com/300x450?text=Kein+Bild';

      const title = item.title || item.name;
      const type = item.media_type === 'tv' ? 'TV-Serie / Sendung' : 'Film';

      let actionButtons = '';
      if (listType === 'want') {
        actionButtons = `
          <button class="btn-seen" onclick="moveToSeen(${index})">Gesehen ✓</button>
          <button class="btn-remove" onclick="removeFromWant(${index})">Entfernen</button>
        `;
      } else if (listType === 'seen') {
        actionButtons = `
          <button onclick="moveToWant(${index})">Nochmal sehen 🎬</button>
          <button class="btn-remove" onclick="removeFromSeen(${index})">Entfernen</button>
        `;
      }

      return `
        <div class="card">
          <img src="${poster}" alt="${title}">
          <div class="card-content">
            <div>
              <div class="card-title">${title}</div>
              <div class="card-type">${type}</div>
            </div>
            <div class="card-actions">
              ${actionButtons}
            </div>
          </div>
        </div>
      `;
    }

    function renderLists() {
      const wantContainer = document.getElementById('wantToWatchList');
      const seenContainer = document.getElementById('alreadySeenList');

      if (wantToWatch.length === 0) {
        wantContainer.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Keine Einträge vorhanden.</p>';
      } else {
        wantContainer.innerHTML = wantToWatch.map((item, i) => createCardHTML(item, 'want', i)).join('');
      }

      if (alreadySeen.length === 0) {
        seenContainer.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Keine Einträge vorhanden.</p>';
      } else {
        seenContainer.innerHTML = alreadySeen.map((item, i) => createCardHTML(item, 'seen', i)).join('');
      }
    }

    async function searchMedia() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Suche läuft...</p>';

      const url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=de-DE&query=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        resultsContainer.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Keine Treffer gefunden.</p>';
          return;
        }

        data.results.forEach(item => {
          if (item.media_type !== 'movie' && item.media_type !== 'tv') return;

          const card = document.createElement('div');
          card.className = 'card';

          const poster = item.poster_path 
            ? `https://image.tmdb.org/t/p/w300${item.poster_path}`
            : 'https://via.placeholder.com/300x450?text=Kein+Bild';

          const title = item.title || item.name;
          const type = item.media_type === 'tv' ? 'TV-Serie / Sendung' : 'Film';

          card.innerHTML = `
            <img src="${poster}" alt="${title}">
            <div class="card-content">
              <div>
                <div class="card-title">${title}</div>
                <div class="card-type">${type}</div>
              </div>
              <div class="card-actions">
                <button onclick='addToWant(${JSON.stringify(item).replace(/'/g, "&apos;")})'>Möchte ich sehen</button>
                <button class="btn-seen" onclick='addToSeen(${JSON.stringify(item).replace(/'/g, "&apos;")})'>Gesehen ✓</button>
              </div>
            </div>
          `;
          resultsContainer.appendChild(card);
        });
      } catch (err) {
        resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Fehler bei der Suche.</p>';
      }
    }

    function addToWant(item) {
      if (!wantToWatch.some(w => w.id === item.id)) {
        wantToWatch.push(item);
        alreadySeen = alreadySeen.filter(s => s.id !== item.id);
        saveAndRender();
      }
    }

    function addToSeen(item) {
      if (!alreadySeen.some(s => s.id === item.id)) {
        alreadySeen.push(item);
        wantToWatch = wantToWatch.filter(w => w.id !== item.id);
        saveAndRender();
      }
    }

    function moveToSeen(index) {
      const item = wantToWatch.splice(index, 1)[0];
      if (!alreadySeen.some(s => s.id === item.id)) {
        alreadySeen.push(item);
      }
      saveAndRender();
    }

    function moveToWant(index) {
      const item = alreadySeen.splice(index, 1)[0];
      if (!wantToWatch.some(w => w.id === item.id)) {
        wantToWatch.push(item);
      }
      saveAndRender();
    }

    function removeFromWant(index) {
      wantToWatch.splice(index, 1);
      saveAndRender();
    }

    function removeFromSeen(index) {
      alreadySeen.splice(index, 1);
      saveAndRender();
    }

    renderLists();
  </script>
</body>
</html>
