<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Film- & Serien-Datenbank</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #03dac6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.95rem;
        }

        .search-box {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background-color: var(--surface-color);
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text-color);
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        .card-info {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 4px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            background-color: #2c2c2c;
            color: var(--primary-color);
            margin-top: 12px;
            align-self: flex-start;
        }

        .badge.tatort, .badge.polizeiruf {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Medien-Archiv</h1>
            <p class="subtitle">Nationale & internationale Filme, Serien, Tatort & Polizeiruf</p>
        </header>
        
        <input type="text" id="searchInput" class="search-box" placeholder="Suchen nach Titel, Ermittlern, Genre..." onkeyup="filterMedia()">

        <div id="mediaGrid" class="grid">
            <!-- Dynamischer Inhalt -->
        </div>
    </div>

    <script>
        const mediaDatabase = [
            { title: "Tatort: Schwanensee", type: "Tatort", genre: "Krimi", year: 2015, info: "Ermittler Thiel & Boerne (Münster)" },
            { title: "Tatort: Der Fall Holdt", type: "Tatort", genre: "Krimi", year: 2017, info: "Ermittlerin Charlotte Lindholm (Hannover)" },
            { title: "Polizeiruf 110: Sabine", type: "Polizeiruf", genre: "Krimi", year: 2021, info: "Ermittler Bukow & König (Rostock)" },
            { title: "Polizeiruf 110: Paranoia", type: "Polizeiruf", genre: "Krimi", year: 2023, info: "Ermittlerin Brasch (Magdeburg)" },
            { title: "Inception", type: "Film", genre: "Sci-Fi / Thriller", year: 2010, info: "Regie: Christopher Nolan" },
            { title: "Breaking Bad", type: "Serie", genre: "Drama", year: 2008, info: "5 Staffeln (Komplett)" },
            { title: "Interstellar", type: "Film", genre: "Sci-Fi", year: 2014, info: "Episches Weltraum-Drama" },
            { title: "Dark", type: "Serie", genre: "Mystery / Sci-Fi", year: 2017, info: "3 Staffeln (Deutsche Netflix-Produktion)" },
            { title: "The Dark Knight", type: "Film", genre: "Action / Thriller", year: 2008, info: "Regie: Christopher Nolan" },
            { title: "Sherlock", type: "Serie", genre: "Krimi / Drama", year: 2010, info: "BBC Produktion mit Benedict Cumberbatch" },
            { title: "Oppenheimer", type: "Film", genre: "Biografie / Drama", year: 2023, info: "Regie: Christopher Nolan" },
            { title: "Babylon Berlin", type: "Serie", genre: "Krimi / Historie", year: 2017, info: "Ermittler Gereon Rath" }
        ];

        function displayMedia(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-secondary);">Keine passenden Einträge gefunden.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let badgeClass = 'badge';
                if (item.type.toLowerCase() === 'tatort') badgeClass += ' tatort';
                if (item.type.toLowerCase() === 'polizeiruf') badgeClass += ' polizeiruf';

                card.innerHTML = `
                    <div>
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-info">📅 ${item.year} &bull; 📂 ${item.genre}</div>
                        <div class="card-info" style="margin-top: 8px;">${item.info}</div>
                    </div>
                    <span class="${badgeClass}">${item.type}</span>
                `;
                grid.appendChild(card);
            });
        }

        function filterMedia() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = mediaDatabase.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.genre.toLowerCase().includes(query) || 
                item.type.toLowerCase().includes(query) ||
                item.info.toLowerCase().includes(query)
            );
            displayMedia(filtered);
        }

        displayMedia(mediaDatabase);
    </script>

</body>
</html>
