<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTracker - Meine Filme & Serien</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #e50914;
      --text-muted: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .results-grid, .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background-color: #222;
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .card-type {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card button {
      padding: 8px;
      font-size: 13px;
      width: 100%;
    }

    .section-title {
      margin-top: 30px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <h1>CineTracker</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Film, Serie oder Tatort suchen...">
    <button onclick="searchMedia()">Suchen</button>
  </div>

  <div class="results-grid" id="searchResults"></div>

  <h2 class="section-title">Meine Liste</h2>
  <div class="watchlist-grid" id="watchlist"></div>

  <script>
    const API_KEY = 'ea010c0eb57a6714faf34f54b6007efc';
    const watchlist = JSON.parse(localStorage.getItem('myCineWatchlist') || '[]');

    function renderWatchlist() {
      const container = document.getElementById('watchlist');
      container.innerHTML = '';
      
      if (watchlist.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Noch keine Einträge vorhanden.</p>';
        return;
      }

      watchlist.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const poster = item.poster_path 
          ? `https://image.tmdb.org/t/p/w300${item.poster_path}`
          : 'https://via.placeholder.com/300x450?text=Kein+Bild';

        const title = item.title || item.name;
        const type = item.media_type === 'tv' ? 'TV-Serie / Sendung' : 'Film';

        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="card-content">
            <div>
              <div class="card-title">${title}</div>
              <div class="card-type">${type}</div>
            </div>
            <button onclick="removeFromWatchlist(${index})" style="background-color: #444;">Entfernen</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function searchMedia() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Suche läuft...</p>';

      const url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=de-DE&query=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        resultsContainer.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Keine Treffer gefunden.</p>';
          return;
        }

        data.results.forEach(item => {
          if (item.media_type !== 'movie' && item.media_type !== 'tv') return;

          const card = document.createElement('div');
          card.className = 'card';

          const poster = item.poster_path 
            ? `https://image.tmdb.org/t/p/w300${item.poster_path}`
            : 'https://via.placeholder.com/300x450?text=Kein+Bild';

          const title = item.title || item.name;
          const type = item.media_type === 'tv' ? 'TV-Serie / Sendung' : 'Film';

          card.innerHTML = `
            <img src="${poster}" alt="${title}">
            <div class="card-content">
              <div>
                <div class="card-title">${title}</div>
                <div class="card-type">${type}</div>
              </div>
              <button onclick='addToWatchlist(${JSON.stringify(item).replace(/'/g, "&apos;")})'>Hinzufügen</button>
            </div>
          `;
          resultsContainer.appendChild(card);
        });
      } catch (err) {
        resultsContainer.innerHTML = '<p style="grid-column: 1/-1;">Fehler bei der Suche.</p>';
      }
    }

    function addToWatchlist(item) {
      const exists = watchlist.some(w => w.id === item.id);
      if (!exists) {
        watchlist.push(item);
        localStorage.setItem('myCineWatchlist', JSON.stringify(watchlist));
        renderWatchlist();
      }
    }

    function removeFromWatchlist(index) {
      watchlist.splice(index, 1);
      localStorage.setItem('myCineWatchlist', JSON.stringify(watchlist));
      renderWatchlist();
    }

    renderWatchlist();
  </script>
</body>
</html>
