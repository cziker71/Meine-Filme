    <script>
        let currentTab = 'watchlist';
        let searchTimeout = null;
        const TMDB_API_KEY = 'ea010c0eb57a6714faf34f54b6007efc';

        // Deine JSONbin Zugangsdaten
        const JSONBIN_API_KEY = '$2a$10$gTEuNP03Ci.mllC3fwupCO0oA2neSflvlIzxb7fgWXekcrRhg.7Im';
        const JSONBIN_ID = '6ad643fbffd5d16053795506';

        let mediaDatabase = JSON.parse(localStorage.getItem('cinetrackerData')) || [
            { 
                id: 1, 
                title: "Interstellar", 
                year: "2014", 
                genre: "Sci-Fi / Drama", 
                tab: "watchlist", 
                poster: "https://image.tmdb.org/t/p/w200/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", 
                cast: "Matthew McConaughey, Anne Hathaway, Jessica Chastain",
                overview: "Ein Team von Forschern reist durch ein Wurmloch im Weltraum, um das Überleben der Menschheit auf einem neuen Planeten zu sichern.",
                selected: false 
            }
        ];

        function saveData() {
            localStorage.setItem('cinetrackerData', JSON.stringify(mediaDatabase));
            syncToCloud();
        }

        function syncToCloud() {
            if (!JSONBIN_API_KEY || !JSONBIN_ID) return;
            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(mediaDatabase)
            }).catch(err => console.log('Cloud-Sync Fehler beim Speichern:', err));
        }

        function syncFromCloud() {
            if (!JSONBIN_API_KEY || !JSONBIN_ID) return;
            fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': JSONBIN_API_KEY
                }
            })
            .then(res => {
                if (!res.ok) throw new Error('Netzwerk-Antwort war nicht ok');
                return res.json();
            })
            .then(data => {
                if (data && data.record) {
                    mediaDatabase = data.record;
                    localStorage.setItem('cinetrackerData', JSON.stringify(mediaDatabase));
                    renderList();
                    alert('Erfolgreich aus der Cloud synchronisiert!');
                }
            })
            .catch(err => alert('Cloud-Laden fehlgeschlagen. Bitte prüfe noch einmal den Master-Key und die Bin-ID direkt auf jsonbin.io.'));
        }

        function switchTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        function searchOnlineMovies(query) {
            clearTimeout(searchTimeout);
            const popup = document.getElementById('searchResultsPopup');
            
            if (!query.trim()) {
                popup.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(() => {
                fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=de-DE&query=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.results && data.results.length > 0) {
                            popup.innerHTML = '';
                            data.results.slice(0, 5).forEach(item => {
                                const title = item.title || item.name;
                                const releaseDate = item.release_date || item.first_air_date || '';
                                const year = releaseDate ? releaseDate.split('-')[0] : 'k.A.';
                                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : '🎬';
                                const mediaType = item.media_type === 'tv' ? 'Serie' : 'Film';
                                const overview = item.overview || 'Keine Beschreibung vorhanden.';
                                const id = item.id;
                                const endpoint = item.media_type === 'tv' ? 'tv' : 'movie';

                                const div = document.createElement('div');
                                div.className = 'search-result-item';
                                div.onclick = () => fetchMovieDetails(endpoint, id, title, year, mediaType, poster, overview);

                                const imgHTML = poster.startsWith('http') 
                                    ? `<img src="${poster}" class="search-result-poster">` 
                                    : `<div class="search-result-poster" style="display:flex;align-items:center;justify-content:center;">🎬</div>`;

                                div.innerHTML = `
                                    ${imgHTML}
                                    <div class="search-result-info">
                                        <h5>${title}</h5>
                                        <p>${year} &bull; ${mediaType}</p>
                                    </div>
                                `;
                                popup.appendChild(div);
                            });
                            popup.style.display = 'block';
                        } else {
                            popup.style.display = 'none';
                        }
                    })
                    .catch(() => popup.style.display = 'none');
            }, 300);
        }

        function fetchMovieDetails(endpoint, id, title, year, genre, poster, overview) {
            fetch(`https://api.themoviedb.org/3/${endpoint}/${id}/credits?api_key=${TMDB_API_KEY}&language=de-DE`)
                .then(res => res.json())
                .then(castData => {
                    const castList = castData.cast && castData.cast.length > 0 ? castData.cast.slice(0, 4).map(c => c.name).join(', ') : 'Besetzung nicht verfügbar';
                    addFoundMovie(title, year, genre, poster, overview, castList);
                })
                .catch(() => {
                    addFoundMovie(title, year, genre, poster, overview, 'Besetzung nicht verfügbar');
                });
        }

        function addFoundMovie(title, year, genre, poster, overview, cast) {
            mediaDatabase.unshift({
                id: Date.now(),
                title: title,
                year: year,
                genre: genre,
                tab: currentTab,
                poster: poster,
                overview: overview,
                cast: cast,
                selected: false
            });

            saveData();
            document.getElementById('quickInput').value = '';
            document.getElementById('searchResultsPopup').style.display = 'none';
            renderList();
        }

        function quickAddCustom() {
            const input = document.getElementById('quickInput');
            const titleText = input.value.trim();
            if (!titleText) return;

            mediaDatabase.unshift({
                id: Date.now(),
                title: titleText,
                year: "2026",
                genre: "Film / Serie",
                tab: currentTab,
                poster: "🎬",
                cast: "Nicht angegeben",
                overview: "Keine Beschreibung vorhanden.",
                selected: false
            });

            saveData();
            input.value = '';
            document.getElementById('searchResultsPopup').style.display = 'none';
            renderList();
        }

        function openModal(editId = null) {
            document.getElementById('editId').value = editId || '';
            if (editId) {
                document.getElementById('modalTitleText').textContent = 'Eintrag bearbeiten';
                const item = mediaDatabase.find(i => i.id === editId);
                if (item) {
                    document.getElementById('newTitle').value = item.title;
                    document.getElementById('newGenre').value = item.genre;
                    document.getElementById('newYear').value = item.year;
                    document.getElementById('newCast').value = item.cast || '';
                    document.getElementById('newOverview').value = item.overview || '';
                    document.getElementById('newPoster').value = item.poster.startsWith('http') ? item.poster : '';
                    document.getElementById('newTab').value = item.tab;
                }
            } else {
                document.getElementById('modalTitleText').textContent = 'Neuen Eintrag hinzufügen';
                document.getElementById('newTitle').value = '';
                document.getElementById('newGenre').value = '';
                document.getElementById('newYear').value = '';
                document.getElementById('newCast').value = '';
                document.getElementById('newOverview').value = '';
                document.getElementById('newPoster').value = '';
                document.getElementById('newTab').value = currentTab;
            }
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        function saveModalEntry() {
            const title = document.getElementById('newTitle').value.trim();
            if (!title) return;

            const editId = document.getElementById('editId').value;
            const genre = document.getElementById('newGenre').value.trim() || 'Film / Serie';
            const year = document.getElementById('newYear').value.trim() || '2026';
            const cast = document.getElementById('newCast').value.trim() || 'Nicht angegeben';
            const overview = document.getElementById('newOverview').value.trim() || 'Keine Beschreibung.';
            const posterInput = document.getElementById('newPoster').value.trim();
            const tab = document.getElementById('newTab').value;

            if (editId) {
                const item = mediaDatabase.find(i => i.id == editId);
                if (item) {
                    item.title = title;
                    item.genre = genre;
                    item.year = year;
                    item.cast = cast;
                    item.overview = overview;
                    if (posterInput) item.poster = posterInput;
                    item.tab = tab;
                }
            } else {
                mediaDatabase.unshift({
                    id: Date.now(),
                    title: title,
                    genre: genre,
                    year: year,
                    poster: posterInput || '🎬',
                    cast: cast,
                    overview: overview,
                    tab: tab,
                    selected: false
                });
            }

            saveData();
            closeModal();
            renderList();
        }

        function showInfo(id) {
            const item = mediaDatabase.find(i => i.id === id);
            if (!item) return;

            document.getElementById('infoTitle').textContent = item.title;
            document.getElementById('infoMeta').textContent = `${item.year} \u2022 ${item.genre}`;
            document.getElementById('infoOverview').textContent = item.overview || 'Keine Handlung verfügbar.';
            document.getElementById('infoCast').textContent = item.cast || 'Keine Angaben';

            const posterImg = document.getElementById('infoPoster');
            if (item.poster.startsWith('http')) {
                posterImg.src = item.poster;
                posterImg.style.display = 'block';
            } else {
                posterImg.style.display = 'none';
            }

            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeInfoModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        function toggleSelect(id) {
            const item = mediaDatabase.find(i => i.id === id);
            if (item) { item.selected = !item.selected; saveData(); }
        }

        function deleteItem(id) {
            mediaDatabase = mediaDatabase.filter(item => item.id !== id);
            saveData();
            renderList();
        }

        function toggleTabStatus(id) {
            const item = mediaDatabase.find(i => i.id === id);
            if (item) {
                item.tab = item.tab === 'watchlist' ? 'watched' : 'watchlist';
                saveData();
                renderList();
            }
        }

        function renderList() {
            const query = document.getElementById('listSearch').value.toLowerCase();
            const grid = document.getElementById('mediaGrid');
            
            document.getElementById('badgeWatchlist').textContent = mediaDatabase.filter(i => i.tab === 'watchlist').length;
            document.getElementById('badgeWatched').textContent = mediaDatabase.filter(i => i.tab === 'watched').length;

            const filtered = mediaDatabase.filter(item => {
                const matchesTab = item.tab === currentTab;
                const matchesSearch = item.title.toLowerCase().includes(query) || 
                                      (item.genre && item.genre.toLowerCase().includes(query)) ||
                                      (item.cast && item.cast.toLowerCase().includes(query));
                return matchesTab && matchesSearch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Keine Einträge gefunden.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let posterHTML = item.poster.startsWith('http')
                    ? `<img src="${item.poster}" class="card-poster-img" alt="Poster">`
                    : `<div class="card-poster-img">${item.poster}</div>`;

                card.innerHTML = `
                    <div class="card-header-line">
                        <div class="card-main-info">
                            <label class="checkbox-container">
                                <input type="checkbox" ${item.selected ? 'checked' : ''} onclick="toggleSelect(${item.id})">
                                <span class="custom-checkbox"></span>
                            </label>
                            ${posterHTML}
                            <div class="card-text-details">
                                <h4>${item.title}</h4>
                                <div class="card-meta">${item.year} &bull; ${item.genre}</div>
                                <div class="card-actors">👤 ${item.cast || 'Unbekannt'}</div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-icon-btn" onclick="showInfo(${item.id})" title="Details / Handlung anzeigen">ℹ️</button>
                            <button class="action-icon-btn" onclick="openModal(${item.id})" title="Bearbeiten">✏️</button>
                            <button class="action-icon-btn" onclick="toggleTabStatus(${item.id})" title="Verschieben">🔄</button>
                            <button class="action-icon-btn" onclick="deleteItem(${item.id})" title="Löschen">🗑️</button>
                        </div>
                    </div>
                    ${item.overview ? `<div class="card-overview">📖 ${item.overview}</div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function pickRandomMovie() {
            const activeItems = mediaDatabase.filter(i => i.tab === currentTab);
            if (activeItems.length === 0) return alert('Keine Filme vorhanden!');
            const randomItem = activeItems[Math.floor(Math.random() * activeItems.length)];
            alert(`Dein Filmtipp für heute:\n\n🎬 ${randomItem.title} (${randomItem.year})\nMit: ${randomItem.cast || 'Unbekannt'}`);
        }

        function shareList() {
            const activeItems = mediaDatabase.filter(i => i.tab === currentTab);
            if (activeItems.length === 0) return alert('Die Liste ist leer!');
            const text = (currentTab === 'watchlist' ? 'Meine Watchlist:\n' : 'Bereits gesehen:\n') + activeItems.map(i => `- ${i.title} (${i.year})`).join('\n');
            navigator.clipboard.writeText(text).then(() => alert('In die Zwischenablage kopiert!'));
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mediaDatabase, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "cinetracker_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(fileEvent) {
            const fileReader = new FileReader();
            if (fileEvent.target.files[0]) {
                fileReader.readAsText(fileEvent.target.files[0], "UTF-8");
                fileReader.onload = function (e) {
                    try {
                        mediaDatabase = JSON.parse(e.target.result);
                        saveData();
                        renderList();
                        alert('Daten erfolgreich importiert!');
                    } catch (error) { alert('Fehler beim Importieren.'); }
                };
            }
        }

        // Beim Start normal lokal laden, damit die App sofort da ist
        renderList();
    </script>
